services:
  postgres:
    image: postgres:16-alpine
    container_name: thepub-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: thepub
      POSTGRES_PASSWORD: thepub
      POSTGRES_DB: thepub
    volumes:
      - thepub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thepub -d thepub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thepub_pg_data:
